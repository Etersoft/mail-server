# Веб-интерфейс mail-server: только из внутренней сети.
# Замените server_name и allow на свои значения.
server {
    listen 80;
    server_name mailing.example.local;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    root /opt/eterfund-mail/mail-server/client/public;
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        # mail-server берёт адрес клиента для журнала из X-Forwarded-For
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ключ API передаёт тот, кто обращается: скрипт, сайт или фронт, через
        # который входят люди. Если людей в веб-интерфейс пускает сам этот nginx
        # (своя проверка входа здесь), добавьте ключ прокси и имя пользователя:
        #   proxy_set_header Authorization "Bearer <ключ из api-keys add front --proxy>";
        #   proxy_set_header X-Remote-User $remote_user;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Страницы подписки: публичные, ссылки на них стоят в письмах.
# HTTPS обычно завершается на внешнем обратном прокси; если сертификат
# ставится здесь — добавьте listen 443 ssl и пути к сертификатам.
server {
    listen 80;
    server_name subscribe.example.com;

    location = /subscribe { proxy_pass http://127.0.0.1:8001; }
    location = /unsubscribe { proxy_pass http://127.0.0.1:8001; }
    location / { return 404; }
}
